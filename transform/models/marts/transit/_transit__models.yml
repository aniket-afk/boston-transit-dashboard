version: 2

models:
  - name: mart_delays_by_neighborhood
    description: "Per-municipality delay metrics. Grain: one row per municipality. Joins fact to dim_stops."
    columns:
      - name: municipality
        tests:
          - not_null
          - unique

  - name: mart_accessibility_gaps
    description: "Service quality by wheelchair-accessibility status. Grain: one row per accessibility category. Equity lens on delay."
    columns:
      - name: wheelchair_accessibility
        tests:
          - not_null
          - unique

  - name: mart_service_summary
    description: "Service volume and delay by hour. Grain: one row per service hour. Extends to daily as history accumulates."
    columns:
      - name: service_hour
        tests:
          - not_null
          - unique

  - name: mart_delay_anomalies
    description: "Statistical outliers: predictions with delay z-score beyond ±2. Grain: one row per anomalous prediction."
    columns:
      - name: prediction_id
        tests:
          - not_null
          
  - name: mart_route_performance
    description: "Per-route delay metrics. Grain: one row per route. Snapshots collapsed to latest observation per prediction."
    columns:
      - name: route_id
        tests:
          - not_null
          - unique

  - name: dim_routes
    description: "Route dimension. One row per MBTA route."
    columns:
      - name: route_id
        tests:
          - not_null
          - unique

  - name: dim_stops
    description: "Stop dimension. One row per stop, with accessibility and location attributes."
    columns:
      - name: stop_id
        tests:
          - not_null
          - unique

  - name: fct_predictions
    description: "Prediction fact. Grain: one row per (prediction_id, loaded_at). Carries delay_seconds vs. the scheduled timetable."
    columns:
      - name: prediction_id
        tests:
          - not_null
      - name: route_id
        description: "FK to dim_routes."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_routes')
                field: route_id
      - name: stop_id
        description: "FK to dim_stops."
        tests:
          - relationships:
              arguments:
                to: ref('dim_stops')
                field: stop_id
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - prediction_id
              - loaded_at
